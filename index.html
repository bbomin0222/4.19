<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>1960년, 그 친구의 휴대폰</title>
<!-- ⚠️ 내용 수정은 content.js 에서 하세요. 이 파일은 휴대폰 '기계' 부분입니다. -->
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('errbox');
  if (box) return;   // 첫 번째 오류만 보여줌 (그게 진짜 원인)
  {
    box = document.createElement('div'); box.id = 'errbox';
    box.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#b00020;color:#fff;font:15px/1.55 -apple-system,sans-serif;padding:12px 14px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5)';
    (document.body || document.documentElement).appendChild(box);
  }
  var f = (e.filename || '').split('/').pop() || '파일';
  box.innerHTML = '⚠️ <b>' + f + '</b> ' + (e.lineno || '?') + '번째 줄 근처에 오류가 있어요.<br>' +
    '따옴표가 ‘ ’ 모양으로 바뀌었거나, 쉼표( , )가 빠졌는지 확인하세요.<br><small style="opacity:.75">' + e.message + '</small>';
});
</script>
<script src="content.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0b0d;color:#fff;overscroll-behavior:none;touch-action:manipulation;
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Roboto","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 50% 40%,#1d1f24 0%,#0a0a0c 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}

/* ───────── 기기 본체 ───────── */
.device{position:absolute;left:50%;top:50%;width:400px;height:812px;transform-origin:center;
  transform:translate(-50%,-50%) scale(var(--s,1));border-radius:54px;
  background:linear-gradient(160deg,#2c2d31 0%,#141416 30%,#0b0b0c 70%,#1e1f22 100%);
  box-shadow:inset 0 0 0 2px #3a3b40,inset 0 0 0 5px #070708,0 30px 80px rgba(0,0,0,.8),0 0 0 1px #000}
.device::before{content:"";position:absolute;inset:6px;border-radius:49px;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.speaker{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:74px;height:7px;border-radius:4px;
  background:repeating-linear-gradient(90deg,#26272b 0 2px,#111 2px 4px);box-shadow:inset 0 1px 2px #000}
.cam{position:absolute;top:36px;left:calc(50% + 62px);width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3b4a6b,#0a0c12 60%)}
.sensor{position:absolute;top:39px;left:calc(50% - 82px);width:6px;height:6px;border-radius:50%;background:#16171a}
.screen{position:absolute;left:20px;top:74px;width:360px;height:624px;background:#000;overflow:hidden;border-radius:3px;box-shadow:0 0 0 2px #050506}
.keys{position:absolute;left:0;right:0;top:716px;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 54px}
.hk{width:48px;height:40px;display:flex;align-items:center;justify-content:center;opacity:.55}
.hk svg{width:24px;height:24px}
.hk:active{opacity:1}
.homekey{width:94px;height:34px;border-radius:12px;border:2px solid #2d2e33;background:linear-gradient(#18191c,#0e0f11);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.homekey::after{content:"";display:block;width:30px;height:12px;margin:auto;border:2px solid #3a3b40;border-radius:3px}
.homekey:active{background:#222}

/* ───────── 상태바 ───────── */
.sbar{position:absolute;top:0;left:0;right:0;height:24px;background:#000;z-index:50;display:flex;align-items:center;
  justify-content:space-between;padding:0 6px;font-size:13px;font-weight:600;cursor:pointer}
.sb-icons{display:flex;gap:5px;align-items:center}
.sb-icons svg{width:14px;height:14px}
.sb-r{display:flex;gap:5px;align-items:center}
.sb-r .g3{font-size:9px;font-weight:700;border:1px solid #fff;border-radius:2px;padding:0 2px;line-height:11px}
.ticker{position:absolute;top:0;bottom:0;left:0;right:112px;background:#000;display:flex;align-items:center;gap:6px;padding-left:6px;
  overflow:hidden;white-space:nowrap;transform:translateY(-100%);transition:transform .25s}
.ticker.on{transform:none}
.ticker svg{width:14px;height:14px;flex:none}
.ticker span{display:inline-block;font-weight:600;animation:tick 4.2s linear}
@keyframes tick{0%,25%{transform:translateX(0)}100%{transform:translateX(var(--tx,0))}}

/* ───────── 화면 공통 ───────── */
.pg{position:absolute;left:0;right:0;top:24px;bottom:0;display:none;flex-direction:column;background:#000;overflow:hidden}
.pg.on{display:flex}
.pg.in{animation:pin .22s ease-out}
@keyframes pin{from{opacity:0;transform:scale(.97)}}
.wall{background:
  radial-gradient(70% 30% at 85% 30%,rgba(255,255,255,.55) 0%,transparent 70%),
  radial-gradient(120% 40% at 10% 62%,rgba(255,255,255,.35) 0%,transparent 60%),
  radial-gradient(90% 35% at 60% 85%,rgba(120,200,255,.6) 0%,transparent 70%),
  linear-gradient(165deg,#0f5cb8 0%,#2a8fe0 30%,#5fb6f0 48%,#1f7fd6 62%,#0b4ca3 100%)}
.bar{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  background:linear-gradient(#3b3d42,#212226);border-bottom:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.bar b{font-size:18px;font-weight:700}
.bar small{font-size:12px;color:#bfc3c9}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.empty{padding:40px 20px;text-align:center;color:#8a8d93;font-size:14px;line-height:1.6}

/* 아이콘 */
.ic{width:56px;height:56px;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.25)}
.ic::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;border-radius:12px 12px 40% 40%/12px 12px 14px 14px;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.06));pointer-events:none}
.ic svg{width:32px;height:32px;position:relative}
.ic-web{background:linear-gradient(#5aa2e8,#1f5fb6)}
.ic-cal{background:linear-gradient(#fafafa,#d0d0d0)}
.ic-memo{background:linear-gradient(#ffe36a,#e9b51c)}
.ic-clock{background:linear-gradient(#e7e7e7,#9a9a9a)}
.ic-gal{background:linear-gradient(#ffc24a,#e27a12)}
.ic-video{background:linear-gradient(#ff6b5e,#c4231b)}
.ic-music{background:linear-gradient(#c46bf0,#7a2bc2)}
.ic-set{background:linear-gradient(#9aa3ad,#4f5760)}
.ic-phone{background:linear-gradient(#6fe06a,#1f9a26)}
.ic-con{background:linear-gradient(#ffb04a,#e0631a)}
.ic-msg{background:linear-gradient(#ffe86a,#e6a812)}
.ic-apps{background:linear-gradient(#4f9fe8,#1d55a8)}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;padding:0 5px;background:#e3261b;
  border:2px solid #fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.5)}

/* ───────── 잠금화면 ───────── */
#lock{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),var(--wall,#123)}
.lk-top{padding:34px 22px 0;display:flex;align-items:flex-end;gap:6px}
.lk-time{font-size:78px;font-weight:200;letter-spacing:-2px;line-height:.9;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.lk-ap{font-size:20px;font-weight:300;padding-bottom:6px}
.lk-date{padding:8px 24px 0;font-size:17px;opacity:.95}
.lk-list{margin:26px 16px 0;display:flex;flex-direction:column;gap:6px}
.lk-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12);font-size:14px;text-align:left;width:100%}
.lk-row svg{width:20px;height:20px;flex:none}
.lk-row div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lk-row b{color:#7fc4ff;margin-left:auto;padding-left:8px}
.lk-slide{position:absolute;left:16px;right:16px;bottom:22px;height:62px;border-radius:8px;background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;touch-action:none}
.lk-knob{position:absolute;left:5px;top:5px;bottom:5px;width:74px;border-radius:6px;background:linear-gradient(#6aa8e8,#2a63b4);
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.lk-knob svg{width:26px;height:26px}
.lk-slide span{padding-left:60px;background:linear-gradient(90deg,#777 0%,#fff 50%,#777 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}

/* ───────── 홈 ───────── */
.widget{margin:14px 12px 10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-end;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.w-time{font-size:58px;font-weight:200;letter-spacing:-1px;line-height:1}
.w-time small{font-size:16px;font-weight:400;margin-left:3px}
.w-date{font-size:14px;margin-top:4px}
.w-wx{text-align:right;font-size:14px}
.w-wx .t{font-size:30px;font-weight:300}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:16px;padding:6px 6px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.app:active .ic{filter:brightness(.7)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:auto;padding-bottom:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.dock{flex:none;height:86px;display:flex;justify-content:space-around;align-items:center;
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.6));border-top:1px solid rgba(255,255,255,.15)}

/* ───────── 전화 ───────── */
.tabs{flex:none;display:flex;background:linear-gradient(#2c2e33,#17181b);border-bottom:1px solid #000}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#c9ccd2;
  border-right:1px solid #0c0c0d;box-shadow:inset 1px 0 0 rgba(255,255,255,.05)}
.tab svg{width:22px;height:22px}
.tab.on{background:linear-gradient(#3d86d8,#1d5aa8);color:#fff}
.numbox{flex:none;height:64px;background:linear-gradient(#e9ebee,#cfd3d8);color:#222;display:flex;align-items:center;justify-content:center;
  font-size:26px;letter-spacing:1px;border-bottom:1px solid #999}
.numbox.ph{font-size:15px;color:#888;letter-spacing:0}
.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);background:#1a1b1e}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #0b0b0c;border-bottom:1px solid #0b0b0c;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.05);background:linear-gradient(#2a2b2f,#1d1e21)}
.key:active{background:#3a6fb0}
.key b{font-size:28px;font-weight:300}
.key small{font-size:10px;color:#999;letter-spacing:1px}
.padbar{flex:none;height:62px;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px;padding:8px;background:#111}
.padbar button{border-radius:6px;background:linear-gradient(#3a3c41,#25262a);display:flex;align-items:center;justify-content:center}
.padbar .call{background:linear-gradient(#5fd35a,#1e9a24)}
.padbar svg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #1d1e21;width:100%;text-align:left;background:linear-gradient(#141518,#0d0e10)}
button.row:active{background:#1f3b63}
.av{width:46px;height:46px;flex:none;border-radius:3px;background:linear-gradient(#8a8d93,#5d6066);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.av svg{width:40px;height:40px}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:#9a9da3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:#9a9da3;flex:none}
.row .miss{color:#ff5a4f}
.dirico svg{width:16px;height:16px;display:block}
.unread{min-width:20px;height:20px;border-radius:10px;background:#2b8ae8;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.mini{width:38px;height:38px;border-radius:5px;background:linear-gradient(#3a3c41,#25262a);display:flex;align-items:center;justify-content:center;flex:none}
.mini svg{width:22px;height:22px}

/* ───────── 메시지 ───────── */
.thread{flex:1;overflow-y:auto;padding:8px 8px 12px;display:flex;flex-direction:column;gap:6px;background:#0d0e10;overscroll-behavior:contain}
.dp{align-self:center;font-size:12px;color:#c9ccd2;background:#3a3c41;padding:3px 12px;border-radius:10px;margin:8px 0 4px}
.mg{display:flex;align-items:flex-end;gap:5px;max-width:84%}
.mg .bb{padding:8px 11px;border-radius:12px;font-size:15px;line-height:1.38;word-break:break-all;user-select:text;box-shadow:0 1px 1px rgba(0,0,0,.4)}
.mg .tm{font-size:10px;color:#8a8d93;white-space:nowrap}
.mg.they .bb{background:#f4f4f4;color:#111;border-top-left-radius:3px}
.mg.me{align-self:flex-end;flex-direction:row-reverse}
.mg.me .bb{background:#ffe95c;color:#111;border-top-right-radius:3px}
.mg.pop{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.compose{flex:none;display:flex;gap:6px;padding:7px;background:linear-gradient(#2a2b2f,#18191c);border-top:1px solid #000}
.compose input{flex:1;height:40px;border-radius:4px;border:1px solid #888;background:#fff;color:#111;padding:0 10px;font-size:16px;outline:none}
.compose button{width:62px;border-radius:4px;background:linear-gradient(#f2f2f2,#c9c9c9);color:#222;font-size:14px;font-weight:600}

/* ───────── 메모 ───────── */
.memobar{background:linear-gradient(#e6c35a,#b8901f);color:#3a2a00}
.memobar small{color:#5a4510}
.memos{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.note{aspect-ratio:1/1.05;background:linear-gradient(#fff6b8,#ffe96a);color:#3a3000;border-radius:2px;padding:10px;text-align:left;
  box-shadow:0 3px 6px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;position:relative}
.note b{font-size:15px;margin-bottom:4px}
.note p{font-size:12px;line-height:1.45;white-space:pre-wrap;overflow:hidden;flex:1;color:#5a4a00}
.note small{font-size:10px;color:#8a7400;margin-top:4px}
.note.new::after{content:"NEW";position:absolute;top:6px;right:6px;font-size:9px;font-weight:800;color:#fff;background:#e3261b;padding:1px 4px;border-radius:3px}
.paper{flex:1;overflow-y:auto;color:#2b2400;padding:12px 18px 40px;
  background:#fff7c2 repeating-linear-gradient(#fff7c2 0 29px,#e7d88a 29px 30px);background-attachment:local}
.paper h2{font-size:21px;line-height:30px}
.paper .d{font-size:12px;color:#8a7a2a;line-height:30px}
.paper p{font-size:17px;line-height:30px;white-space:pre-wrap;user-select:text}

/* ───────── 인터넷(뉴스) ───────── */
.addr{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#e2e5e9,#bfc4ca);border-bottom:1px solid #777}
.addr div{flex:1;height:30px;border-radius:4px;background:#fff;border:1px solid #888;color:#333;font-size:13px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.addr svg{width:22px;height:22px}
.web{flex:1;overflow-y:auto;background:#fff;color:#111}
.web .hd{background:#c4211a;color:#fff;padding:10px 12px;font-size:20px;font-weight:800;letter-spacing:-.5px}
.web .hd small{font-size:11px;font-weight:400;opacity:.85;margin-left:6px}
.nrow{display:block;width:100%;text-align:left;padding:12px;border-bottom:1px solid #ddd;color:#111}
.nrow:active{background:#eef3fb}
.nrow .tg{font-size:11px;color:#c4211a;font-weight:700}
.nrow .tt{font-size:16px;font-weight:700;line-height:1.35;margin-top:2px}
.nrow .tt i{display:inline-block;font-style:normal;font-size:9px;color:#fff;background:#c4211a;padding:0 3px;border-radius:2px;vertical-align:2px;margin-left:4px}
.nrow .sm{font-size:13px;color:#555;margin-top:4px;line-height:1.45}
.nrow .tm{font-size:11px;color:#999;margin-top:4px}
.art{padding:14px 14px 40px}
.art .tg{font-size:12px;color:#c4211a;font-weight:700}
.art h1{font-size:22px;line-height:1.35;margin:4px 0 6px;letter-spacing:-.5px}
.art .tm{font-size:12px;color:#888;padding-bottom:10px;border-bottom:2px solid #c4211a;margin-bottom:12px}
.art .bd{font-size:16px;line-height:1.8;white-space:pre-wrap;user-select:text}
.art .nt{margin-top:24px;font-size:11px;color:#999}

/* ───────── 갤러리 ───────── */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.pgrid button{aspect-ratio:1;background:#222 center/cover;border:1px solid #333}
#photo .st{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#photo img{max-width:100%;max-height:100%;object-fit:contain}
#photo .cap{flex:none;padding:10px 14px 16px;background:#1e1e20;font-size:13px;color:#ccc;line-height:1.5}
#photo .cap b{display:block;color:#fff;font-size:14px}

/* ───────── 동영상 ───────── */
.vcard{display:flex;gap:10px;width:100%;text-align:left;padding:8px;border-bottom:1px solid #1d1e21}
.vcard:active{background:#1f3b63}
.vth{width:128px;aspect-ratio:16/9;background:#222 center/cover;position:relative;flex:none;border:1px solid #333}
.vth span{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.8);font-size:10px;padding:0 3px}
.vcard .t{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vcard .c{font-size:11px;color:#9a9da3;margin-top:4px}
.player{flex:none;width:100%;aspect-ratio:16/9;background:#000}
.player video,.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.watch{flex:1;overflow-y:auto}
.wi{padding:10px 12px}
.wi h2{font-size:16px;line-height:1.4}
.wi .v{font-size:12px;color:#9a9da3;margin-top:4px}
.chn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #1d1e21;border-bottom:1px solid #1d1e21}
.chn .ca{width:32px;height:32px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center;font-size:13px}
.chn b{font-size:14px}
.chn .sb{margin-left:auto;background:#c4231b;color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:3px}
.acts{display:flex;gap:6px;padding:8px 12px}
.acts span{background:#26272b;border-radius:3px;padding:5px 10px;font-size:12px}
.cprev{display:block;width:calc(100% - 24px);margin:4px 12px 14px;background:#1b1c1f;border:1px solid #2c2d31;border-radius:4px;padding:10px;text-align:left}
.cprev .h{font-size:14px;font-weight:700}.cprev .h span{color:#9a9da3;font-weight:400;margin-left:6px}
.cprev .o{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px}
.cprev .o div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes ring{50%{transform:translateX(5px)}}

  font-size:13px;padding:8px 14px;border-radius:4px;white-space:nowrap;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}

.ending.on{display:flex}

.ending p.on{opacity:1}

<script>
/* ================================================================

const stg = m => m.단계 || 1;
function parseT(t){ const m = /(오전|오후)\s*(\d+):(\d+)/.exec(t || ''); if (!m) return 0; let h = +m[2] % 12; if (m[1] === '오후') h += 12; return h * 60 + +m[3]; }
function fmtT(min){ min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min / 60), m = min % 60; return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(m).padStart(2, '0')}`; }
const nowT = () => fmtT(ST.minBase + ST.min);
function tickClock(){ const t = nowT(), [ap, hm] = t.split(' '); $('#sbTime').textContent = t; $('#lkTime').textContent = hm; $('#lkAp').textContent = ap; $('#wTime').innerHTML = `${hm}<small>${ap}</small>`; }

/* ---------- 화면 이동 ---------- */
const RENDER = {};
function show(id, push = true){
  if (push && ST.cur !== id && ST.cur !== 'call' && ST.cur !== 'lock') ST.stack.push(ST.cur);
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on', 'in'));
  const pgId = id === 'article' ? 'web' : id;
  $('#' + pgId).classList.add('on', 'in');
  ST.cur = id;
  if (id !== 'watch'){ $('#player').innerHTML = ''; $('#sheet').classList.remove('on'); }
  if (RENDER[id]) RENDER[id]();
}
function goHome(){ if (ST.cur === 'lock' || ST.cur === 'call') return; closeDrawer(); ST.stack = []; show('home', false); }
function goBack(){
  if ($('#drawer').classList.contains('on')) return closeDrawer();
  if ($('#sheet').classList.contains('on')) return $('#sheet').classList.remove('on');
  if (['lock', 'call', 'home'].includes(ST.cur)) return;
  const prev = ST.stack.pop(); show(prev || 'home', false);
}
$('#kHome').onclick = () => { actx(); goHome(); };
$('#kBack').onclick = () => { actx(); goBack(); };
$('#kMenu').onclick = () => toast('메뉴');
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearT('toast'); T.toast = setTimeout(() => el.classList.remove('on'), 1800); }

/* ---------- 알림 ---------- */
function computeUnread(){
  Object.keys(ST.threads).forEach(k => {
    let n = 0; const ms = ST.threads[k];
    for (let i = ms.length - 1; i >= 0; i--){ const m = ms[i]; if (m.날 || stg(m) > ST.stage) continue; if (m.누가 === '나' || stg(m) !== ST.stage) break; n++; }
    ST.unread[k] = n;
  });
}
const lastMsg = k => [...ST.threads[k]].reverse().find(m => !m.날 && stg(m) <= ST.stage);
const missedToday = () => ST.calls.filter(c => c.부재중 && c.날짜 === today());
function buildNotifs(){
  const list = [], mt = missedToday();
  if (mt.length) list.push({ id:'miss', g:'phone', t:`부재중 전화 ${mt.length}`, s: who(mt[0].누구).이름, go:() => openPhone('log') });
  Object.keys(ST.unread).forEach(k => { if (ST.unread[k]) list.push({ id:'m_' + k, g:'msg', t: who(k).이름, s: lastMsg(k).내용, go:() => openThread(k) }); });
  뉴스.forEach((n, i) => { if (n.단계 === ST.stage && !ST.seenNews.has(i)) list.push({ id:'n' + i, g:'web', t: n.머리말, s: n.제목, go:() => openArticle(i) }); });
  메모.forEach((m, i) => { if (ST.stage > 1 && m.단계 === ST.stage && !ST.seenMemo.has(i)) list.push({ id:'o' + i, g:'memo', t:'메모', s: m.제목, go:() => openMemo(i) }); });
  ST.notifs = list; ST.missedUnseen = mt.length; renderSbIcons(); updateBadges();
}
function addNotif(n){ ST.notifs = ST.notifs.filter(x => x.id !== n.id); ST.notifs.push(n); renderSbIcons(); }
function dropNotif(id){ ST.notifs = ST.notifs.filter(n => n.id !== id); renderSbIcons(); }
function renderSbIcons(){ const seen = new Set(); $('#sbIcons').innerHTML = ST.notifs.filter(n => !seen.has(n.g) && seen.add(n.g)).map(n => SMALL[n.g]).join(''); }
function ticker(n){
  const el = $('#ticker'); el.innerHTML = SMALL[n.g] + `<span>${esc(n.t)}: ${esc(n.s)}</span>`; el.classList.add('on');
  requestAnimationFrame(() => { const sp = el.querySelector('span'), over = sp.scrollWidth - (el.clientWidth - 30); sp.style.setProperty('--tx', (over > 0 ? -over : 0) + 'px'); });
  clearT('tk'); T.tk = setTimeout(() => el.classList.remove('on'), 4300);
}
function tickerQueue(list, i = 0){ if (i >= list.length) return; ticker(list[i]); T.tq = setTimeout(() => tickerQueue(list, i + 1), 4600); }
function updateBadges(){
  const set = (k, n) => document.querySelectorAll(`[data-badge="${k}"]`).forEach(b => { b.textContent = n; b.style.display = n ? 'flex' : 'none'; });
  set('msg', Object.values(ST.unread).reduce((a, b) => a + b, 0));
  set('phone', ST.missedUnseen);
  set('web', 뉴스.filter((n, i) => n.단계 <= ST.stage && !ST.seenNews.has(i)).length);
  set('memo', 메모.filter((m, i) => ST.stage > 1 && m.단계 === ST.stage && !ST.seenMemo.has(i)).length);
}

/* 알림창 (상태바를 누르면 내려옴) */

function unlock(){ if (ST.cur !== 'lock') return; actx(); armFallback(); ST.stack = []; show('home', false); }
(function slider(){
  const sl = $('#lkSlide'), kn = $('#lkKnob'); let x0 = null, dx = 0;
  sl.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; kn.style.transition = 'none'; try { sl.setPointerCapture(e.pointerId); } catch (_) {} });
  sl.addEventListener('pointermove', e => { if (x0 === null) return; dx = Math.max(0, Math.min(250, (e.clientX - x0) / scale())); kn.style.transform = `translateX(${dx}px)`; });
  const up = () => { if (x0 === null) return; x0 = null; kn.style.transition = 'transform .2s'; kn.style.transform = ''; if (dx > 140 || dx < 6) unlock(); };
  sl.addEventListener('pointerup', up); sl.addEventListener('pointercancel', up);
})();
$('#lock').addEventListener('click', e => { if (!e.target.closest('.lk-row') && !e.target.closest('#lkSlide')) unlock(); });

    $('#pCall').onclick = () => {
      if (!ST.dial) return toast('번호를 입력하세요');
      const k = Object.keys(연락처).find(x => 연락처[x].번호.replace(/-/g, '') === ST.dial.replace(/-/g, ''));
      const d = ST.dial; ST.dial = ''; callOut(k || d);

  } else if (ST.tab === 'log'){
    ST.missedUnseen = 0; updateBadges(); dropNotif('miss');
    body.innerHTML = `<div class="scroll">${ST.calls.map((c, i) => {
      const p = who(c.누구), when = c.날짜 === today() ? c.시각 : c.날짜;

      return `<button class="row" data-i="${i}"><div class="av">${G.person}</div><div class="mid"><div class="nm ${c.부재중 ? 'miss' : ''}">${esc(p.이름)}</div><div class="sub">${esc(p.번호)}${c.길이 ? ' · ' + esc(c.길이) : ''}</div></div><div class="rt"><span class="dirico">${ar}</span>${esc(when)}</div></button>`;
    }).join('')}</div>`;

  } else if (ST.tab === 'contacts'){
    body.innerHTML = `<div class="scroll">${Object.keys(연락처).map(k => `<div class="row"><div class="av">${G.person}</div><div class="mid"><div class="nm">${esc(연락처[k].이름)}</div><div class="sub">${esc(연락처[k].번호)}</div></div>
      <button class="mini" data-call="${k}">${G.phone}</button>${ST.threads[k] ? `<button class="mini" data-msg="${k}">${G.msg}</button>` : ''}</div>`).join('')}</div>`;
    body.querySelectorAll('[data-call]').forEach(b => b.onclick = () => callOut(b.dataset.call));

RENDER.msgs = () => {
  const keys = Object.keys(ST.threads).filter(k => lastMsg(k));
  keys.sort((a, b) => (ST.unread[b] || 0) - (ST.unread[a] || 0) || stg(lastMsg(b)) - stg(lastMsg(a)));
  $('#msgCount').textContent = `${keys.length}개 대화`;
  $('#msgList').innerHTML = keys.map(k => {
    const m = lastMsg(k), d = [...ST.threads[k]].reverse().find(x => x.날 && stg(x) <= ST.stage);
    const when = d && dayOnly(d.날) === today() ? m.시각 : (d ? dayOnly(d.날) : '');
    return `<button class="row" data-k="${k}"><div class="av">${G.person}</div><div class="mid"><div class="nm">${esc(who(k).이름)}</div><div class="sub">${esc(m.내용)}</div></div>
      <div class="rt"><span>${esc(when)}</span>${ST.unread[k] ? `<span class="unread">${ST.unread[k]}</span>` : ''}</div></button>`;
  }).join('') || '<div class="empty">메시지 없음</div>';
  document.querySelectorAll('#msgList .row').forEach(b => b.onclick = () => openThread(b.dataset.k));
};
function openThread(k){
  ST.room = k; ST.unread[k] = 0; dropNotif('m_' + k); updateBadges();
  show('thread');
  if (k === '민수' && ST.stage === 2 && !ST.stage3){ clearT('s2'); T.s2 = setTimeout(toStage3, 진행.민수문자읽고_다음날짜까지 * 1000); }
}
RENDER.thread = pop => {
  const k = ST.room, p = who(k), ms = ST.threads[k].filter(m => stg(m) <= ST.stage);
  $('#thName').textContent = p.이름; $('#thNo').textContent = p.번호;
  $('#thBody').innerHTML = ms.map((m, i) => m.날 ? `<div class="dp">${연도}년 ${esc(m.날)}</div>`
    : `<div class="mg ${m.누가 === '나' ? 'me' : 'they'}${pop === true && i === ms.length - 1 ? ' pop' : ''}"><div class="bb">${esc(m.내용)}</div><div class="tm">${esc(m.시각)}</div></div>`).join('');
  $('#thBody').scrollTop = 1e6;
};
$('#compose').onsubmit = e => { e.preventDefault(); const v = $('#thInput').value.trim(); if (!v) return; $('#thInput').value = ''; sendMsg(v); };
function addMsg(k, from, text){
  // 나중 날짜(아직 안 보이는) 문자보다 앞에 끼워 넣기
  const th = ST.threads[k], last = [...th].reverse().find(m => m.날 && stg(m) <= ST.stage);
  let at = th.findIndex(m => stg(m) > ST.stage); if (at < 0) at = th.length;
  const add = [];
  if (!last || norm(last.날) !== norm(D().날짜)) add.push({ 단계:ST.stage, 날:D().날짜 });
  add.push({ 단계:ST.stage, 누가:from, 내용:text, 시각:nowT() });
  th.splice(at, 0, ...add);
}
function sendMsg(t){
  const k = ST.room; ST.min++; tickClock();
  addMsg(k, '나', t); RENDER.thread(true); tone(1320, 0, .1, .05, 'sine');
  const sp = 특정답장.find(r => (r.누구 === '아무나' || r.누구 === k) && norm(r.보낸말) === norm(t));
  if (sp){ replySeq(k, [].concat(sp.답)); return; }
  const ar = 자동답장[k] || [];
  if (ar.length){ const i = ST.replyIdx[k] || 0; ST.replyIdx[k] = i + 1; replySeq(k, [ar[Math.min(i, ar.length - 1)]]); }
  if (k === '주열' && ST.stage === 1 && !ST.juyeolCalled && ++ST.sentToJuyeol >= 진행.주열에게_보낼문자수){ clearT('jc'); T.jc = setTimeout(juyeolCall, 진행.문자보내고_전화까지 * 1000); }
  if (k === '민수' && ST.stage === 2 && !ST.stage3){ clearT('s2'); T.s2 = setTimeout(toStage3, (진행.민수에게답장후_다음날짜까지 + 진행.답장오기까지) * 1000); }
}
function replySeq(k, list, i = 0){
  if (i >= list.length) return;
  const st = ST.stage;
  setTimeout(() => {
    if (ST.stage !== st) return;
    addMsg(k, '상대', list[i]);
    if (ST.cur === 'thread' && ST.room === k){ RENDER.thread(true); tone(988, 0, .1, .06, 'sine'); tone(1318, .12, .14, .06, 'sine'); }
    else { ST.unread[k] = (ST.unread[k] || 0) + 1; const n = { id:'m_' + k, g:'msg', t:who(k).이름, s:list[i], go:() => openThread(k) }; addNotif(n); updateBadges(); ticker(n); tone(988, 0, .1, .06, 'sine'); if (ST.cur === 'msgs') RENDER.msgs(); }
    replySeq(k, list, i + 1);
  }, (i === 0 ? 진행.답장오기까지 : 1.4) * 1000);
}

  $('#galCount').textContent = `${list.length}장`;
  $('#pgrid').innerHTML = list.map(p => `<button data-i="${사진.indexOf(p)}" style="background-image:url('${esc(p.파일)}')"></button>`).join('');
  document.querySelectorAll('#pgrid button').forEach(b => b.onclick = () => { const p = 사진[b.dataset.i]; show('photo'); $('#phImg').src = p.파일; $('#phCap').innerHTML = `<b>${esc(p.날짜)}</b>${esc(p.설명)}`; });
};

/* ---------- 동영상 ---------- */
const COLORS = ['#c9a24b', '#5d8f4e', '#4f7fbf', '#a05a8c', '#6b6b6b', '#b5655a', '#3f8f8f'];
const vth = v => v.썸네일 || (v.유튜브 ? `https://i.ytimg.com/vi/${v.유튜브}/hqdefault.jpg` : '');
const vcard = v => `<button class="vcard" data-v="${동영상.indexOf(v)}"><div class="vth" style="background-image:url('${esc(vth(v))}')">${v.길이 ? `<span>${esc(v.길이)}</span>` : ''}</div>
  <div><div class="t">${esc(v.제목)}</div><div class="c">${esc(v.채널)}<br>${esc(v.조회수 || '')}${v.올린때 ? ' · ' + esc(v.올린때) : ''}</div></div></button>`;
const bindV = root => root.querySelectorAll('.vcard').forEach(b => b.onclick = () => playVideo(+b.dataset.v));
RENDER.videos = () => { const list = 동영상.filter(v => stg(v) <= ST.stage); $('#vList').innerHTML = list.map(vcard).join('') || '<div class="empty">동영상 없음</div>'; bindV($('#vList')); };
function playVideo(i){
  const v = 동영상[i]; ST.video = v; show('watch');
  $('#player').innerHTML = v.파일 ? `<video src="${esc(v.파일)}" poster="${esc(v.썸네일 || '')}" controls playsinline autoplay></video>`
    : v.유튜브 ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.유튜브)}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`
    : '<div class="empty">content.js 에 영상 파일 이름을 넣어 주세요</div>';
  const c = (v.댓글 || [])[0];
  $('#wBody').innerHTML = `<div class="wi"><h2>${esc(v.제목)}</h2><div class="v">${esc(v.조회수 || '')}${v.올린때 ? ' · ' + esc(v.올린때) : ''}</div></div>
    <div class="chn"><div class="ca">${esc(v.채널.slice(0, 1))}</div><b>${esc(v.채널)}</b><span class="sb">구독</span></div>
    <div class="acts"><span>👍 ${esc(v.좋아요 || '')}</span><span>👎</span><span>공유</span><span>저장</span></div>
    ${c ? `<button class="cprev" id="cprev"><div class="h">댓글<span>${esc(v.댓글수 || v.댓글.length)}</span></div><div class="o"><div class="cav" style="background:${COLORS[0]}">${esc((c.아이디[1] || c.아이디[0]).toUpperCase())}</div><div>${esc(c.내용)}</div></div></button>` : ''}
    ${동영상.filter((x, j) => j !== i && stg(x) <= ST.stage).map(vcard).join('')}`;
  bindV($('#wBody')); if (c) $('#cprev').onclick = openComments; $('#wBody').scrollTop = 0;
}
function openComments(){
  $('#clist').innerHTML = ST.video.댓글.map((c, i) => `<div class="cm"><div class="cav" style="background:${c.색 || COLORS[i % COLORS.length]}">${esc((c.아이디[1] || c.아이디[0]).toUpperCase())}</div><div style="flex:1;min-width:0">
    <div class="u">${esc(c.아이디)} · ${esc(c.때)}</div><div class="x">${esc(c.내용)}</div><div class="r"><span>👍 ${esc(c.좋아요 || '')}</span><span>👎</span><span>답글</span></div>
    ${c.답글 ? `<div class="rp">답글 ${esc(c.답글)}개 보기</div>` : ''}</div></div>`).join('');
  $('#sheet').classList.add('on'); $('#clist').scrollTop = 0;
}
$('#sheetX').onclick = () => $('#sheet').classList.remove('on');
$('#cform').onsubmit = e => { e.preventDefault(); const t = $('#cinput').value.trim(); if (!t) return; ST.video.댓글.unshift({ 아이디:'@나', 때:'방금 전', 내용:t, 좋아요:'', 답글:0, 색:'#2b8ae8' }); $('#cinput').value = ''; openComments(); };

/* ---------- 소리 ---------- */
let ac;
function actx(){ try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} return ac; }
function tone(f, start, dur, vol = .15, type = 'triangle'){
  const a = actx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function ringPhrase(){ [784, 988, 1175, 988, 784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .14, .28, .1, 'square')); }
function startRing(){ stopRing(); ringPhrase(); T.ring = setInterval(ringPhrase, 2200); if (navigator.vibrate){ navigator.vibrate([700, 400, 700]); T.vib = setInterval(() => navigator.vibrate([700, 400, 700]), 2200); } }
function stopRing(){ clearT('ring', 'vib', 'rb'); navigator.vibrate && navigator.vibrate(0); }
function ringback(){ const p = () => { tone(440, 0, 1, .07, 'sine'); tone(480, 0, 1, .07, 'sine'); }; p(); T.rb = setInterval(p, 3000); }
function busy(){ [0, .6, 1.2].forEach(s => { tone(480, s, .35, .1, 'sine'); tone(620, s, .35, .1, 'sine'); }); }
let callAudio = null;
function playAudio(src, onEnd){ stopAudio(); callAudio = new Audio(src); callAudio.playsInline = true; if (onEnd) callAudio.onended = onEnd; callAudio.play().catch(() => {}); return callAudio; }
function stopAudio(){ if (callAudio){ try { callAudio.pause(); } catch (e) {} callAudio = null; } try { speechSynthesis.cancel(); } catch (e) {} }
let koV = null;
function koVoice(){ if (koV) return koV; try { koV = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)) || null; } catch (e) {} return koV; }
try { speechSynthesis.onvoiceschanged = () => { koV = null; koVoice(); }; } catch (e) {}

/* ---------- 통화 ---------- */
const CALL = { mode:null, who:null, secs:0, ended:true, kind:null, caps:[] };
const fmtS = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function callUI(){
  const p = who(CALL.who);
  $('#clNm').textContent = p.이름; $('#clNo').textContent = p.번호 === p.이름 ? '저장되지 않은 번호' : p.번호;
  $('#clFace').innerHTML = G.person;
  if (CALL.mode === 'in'){
    $('#clSt').textContent = '수신 전화'; $('#clCap').textContent = ''; $('#clCap').className = 'cl-cap';
    $('#clBot').innerHTML = `<div class="inc"><button class="ib ok" id="cAns">${G.phone}통화</button><button class="ib no" id="cRej">${G.phone}거절</button></div>`;
    $('#cAns').onclick = answer; $('#cRej').onclick = reject;
  } else {
    $('#clBot').innerHTML = `<div class="cl-info"><span class="hold">▌▌ 일시중단</span><span id="clTime">${CALL.mode === 'out' ? '발신 중' : '통화 중 00:00'}</span></div>
      <div class="cl-grid"><button class="cb">${G.rec}녹음</button><button class="cb">${G.dial}다이얼</button><button class="cb end" id="cEnd">${G.hang}통화 종료</button>
      <button class="cb">${G.spk}스피커</button><button class="cb">${G.mute}음소거</button><button class="cb">${G.bt}Bluetooth</button></div>`;
    $('#cEnd').onclick = hangUp;
  }
}
function incoming(k, kind){
  closeDrawer(); $('#thInput').blur();
  Object.assign(CALL, { mode:'in', who:k, kind, secs:0, ended:false, caps:[] });
  if (ST.cur !== 'call') ST.returnTo = ST.cur;
  show('call', false); callUI(); startRing();
}
function answer(){
  stopRing(); CALL.mode = 'talk'; callUI(); $('#clSt').textContent = '통화 중';
  CALL.secs = 0; T.tick = setInterval(() => { CALL.secs++; const el = $('#clTime'); if (el) el.textContent = '통화 중 ' + fmtS(CALL.secs); if (CALL.kind === 'juyeol' && CALL.secs >= 주열전화.끊기는초) hangUp(); }, 1000);
  const cap = (t, mine) => { $('#clCap').textContent = '“' + t + '”'; $('#clCap').className = 'cl-cap' + (mine ? ' mine' : ''); };
  if (CALL.kind === 'juyeol'){
    if (주열전화.녹음파일) playAudio(주열전화.녹음파일);
    CALL.caps = 주열전화.내대사.map(([s, t]) => setTimeout(() => cap(t, true), s * 1000));
  } else if (CALL.kind === 'minsu'){
    const lines = 민수전화.대사;
    if (민수전화.녹음파일){
      const a = playAudio(민수전화.녹음파일, () => setTimeout(hangUp, 1000)), times = 민수전화.대사시작초 || [];
      const sched = dur => { CALL.caps = lines.map((t, i) => setTimeout(() => cap(t), 1000 * (times[i] != null ? times[i] : dur / lines.length * i))); };
      if (times.length) sched(); else if (isFinite(a.duration) && a.duration) sched(a.duration); else a.addEventListener('loadedmetadata', () => sched(a.duration), { once:true });
      setTimeout(() => { if (a.error) speak(lines, cap); }, 1500);
    } else speak(lines, cap);
  }
}
function speak(lines, cap){
  let i = 0; const tts = 민수전화.기기음성 && 'speechSynthesis' in window;
  const next = () => {
    if (CALL.ended) return;
    if (i >= lines.length){ setTimeout(hangUp, 1300); return; }
    const t = lines[i++]; cap(t); const t0 = Date.now(), min = 1400 + t.length * 110;
    let done = false; const go = () => { if (done) return; done = true; setTimeout(next, Math.max(350, min - (Date.now() - t0))); };
    if (tts){ try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 1.1; const v = koVoice(); if (v) u.voice = v; u.onend = go; u.onerror = go; speechSynthesis.speak(u); } catch (e) {} setTimeout(go, 1800 + t.length * 230); }
    else setTimeout(go, min);
  };
  setTimeout(next, 900);
}
function logCall(extra){ ST.calls.unshift({ 누구:CALL.who, 시각:nowT(), 날짜:today(), ...extra }); }
function reject(){ stopRing(); CALL.ended = true; logCall({ 부재중:true }); ST.missedUnseen++; afterCall(); }
function hangUp(){
  if (CALL.ended) return; CALL.ended = true;
  stopRing(); stopAudio(); clearT('tick', 'out', 'out2'); CALL.caps.forEach(clearTimeout);
  if (CALL.mode === 'out') logCall({ 발신:true }); else logCall({ 길이:fmtS(CALL.secs) });
  $('#clSt').textContent = '통화 종료'; const el = $('#clTime'); if (el) el.textContent = '통화 종료 ' + fmtS(CALL.secs);
  if (CALL.mode !== 'out') $('#clCap').textContent = '';
  busy(); setTimeout(afterCall, 1800);
}
function afterCall(){
  const k = CALL.kind; CALL.kind = null;
  if (k === 'juyeol') return goStage(2);
  if (k === 'minsu') return goStage(4);
  const back = ST.returnTo && !['lock', 'call'].includes(ST.returnTo) ? ST.returnTo : 'home';
  show(back, false);
}
function callOut(k){
  Object.assign(CALL, { mode:'out', who:k, kind:null, secs:0, ended:false, caps:[] });
  ST.returnTo = ST.cur; show('call', false); callUI(); $('#clSt').textContent = '발신 중…'; $('#clCap').textContent = ''; $('#clCap').className = 'cl-cap'; ringback();
  T.out = setTimeout(() => { clearT('rb'); $('#clCap').textContent = '상대방이 응답하지 않습니다.'; T.out2 = setTimeout(hangUp, 1800); }, 7000);
}

/* ---------- 이야기 진행 ---------- */
function armFallback(){ if (ST.stage === 1 && !ST.juyeolCalled && !T.fb) T.fb = setTimeout(juyeolCall, 진행.아무것도안해도_전화까지 * 1000); }
function juyeolCall(){
  if (ST.juyeolCalled || ST.stage !== 1) return;
  if (ST.cur === 'call'){ T.jc = setTimeout(juyeolCall, 3000); return; }
  ST.juyeolCalled = true; clearT('fb', 'jc'); incoming('주열', 'juyeol');
}
function goStage(n){
  stopRing(); stopAudio(); clearT('tick', 'out', 'out2', 'jc', 'fb', 's2', 'tq', 'mc'); CALL.caps.forEach(clearTimeout); CALL.ended = true;
  ST.stage = n; ST.min = 0; ST.minBase = parseT(D().시각); if (n > 1) ST.juyeolCalled = true; if (n >= 3) ST.stage3 = true;
  computeUnread(); buildNotifs(); closeDrawer();
  ST.stack = []; show('lock', false);
  T.tq = setTimeout(() => tickerQueue(ST.notifs), 600);
  if (n === 3) T.mc = setTimeout(() => { if (ST.stage === 3) incoming('민수', 'minsu'); }, 진행.민수전화_오기까지 * 1000);
}
function toStage3(){ if (ST.stage3 || ST.stage !== 2) return; goStage(3); }
function showEnding(){
  if (ST.ended) return; ST.ended = true;
  const el = $('#ending'); $('#endLines').innerHTML = 마무리.map(t => `<p>${esc(t)}</p>`).join('');
  el.classList.add('on'); $('#endTap').style.opacity = 0; el.onclick = null;
  const ps = [...el.querySelectorAll('p')]; ps.forEach((p, i) => setTimeout(() => p.classList.add('on'), 600 + i * 1700));
  setTimeout(() => { $('#endTap').style.opacity = 1; el.onclick = () => { el.classList.remove('on'); ST.stack = []; show('home', false); }; }, 600 + ps.length * 1700);
}

/* ---------- 발표자 단축키 ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(); actx();
  if (k === 'c'){ if (ST.stage === 1) juyeolCall(); else if (ST.stage === 3 && ST.cur !== 'call') incoming('민수', 'minsu'); }
  if (k === 'n'){ if (ST.stage < 4) goStage(ST.stage + 1); else showEnding(); }
  if (k === 'r') location.reload();
});

/* ---------- 시작 ---------- */
document.documentElement.style.setProperty('--wall', getComputedStyle($('#home')).backgroundImage);
ST.minBase = parseT(D().시각);
computeUnread(); buildNotifs(); show('lock', false);
T.tq = setTimeout(() => tickerQueue(ST.notifs), 800);
</script>
</body>
